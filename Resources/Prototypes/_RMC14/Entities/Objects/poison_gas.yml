- type: entity
  id: RMCLandingZoneGas
  name: CN20-X miasma
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Effects
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke
    color: "#30193499"
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: DamageOverTime
    affectsDead: false
    armorPiercingDamage:
      groups:
        Burn: 4
    emotes:
    - Cough
    - Gasp
    popup: "Your skin is sloughing off!"
    multipliers:
    - multiplier: 3
      whitelist:
        components:
        - Xeno
  - type: DeleteOnDropshipLaunchFromWarship

- type: entity
  id: RMCGasWeedKiller
  name: C10-W weedkiller
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Effects
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke
    color: "#c2aac799"
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: TimedDespawn
    lifetime: 1.5

- type: entity
  parent: RMCSmoke
  id: RMCTeargasSmoke
  name: tear gas
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - MobMask
        layer:
        - MidImpassable
  - type: Occluder
  - type: Sprite
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke2
    color: "#e02828"
  - type: TimedDespawn
    lifetime: 12
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: ActiveEdgeSpreader
  - type: EdgeSpreader
    id: RMCTeargasSmoke
  - type: EvenSmoke
    spawn: RMCTeargasSmoke
    range: 4
  - type: TeargasInjector
    gasPerSecond: 6
    affectsDead: false
    affectsInfectedNested: true
  - type: DamageOverTime
    affectsDead: false
    affectsInfectedNested: true
    damage:
      types:
        Asphyxiation: 0
    emotes:
    - Cough
    - Gasp
    whitelist:
      components:
      - Marine
  - type: DeleteOnExplosion

- type: edgeSpreader
  id: RMCTeargasSmoke
  updatesPerSecond: 2
