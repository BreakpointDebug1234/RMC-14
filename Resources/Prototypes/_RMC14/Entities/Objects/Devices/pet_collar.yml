- type: entity
  parent: BaseItem
  id: RMCPetCollar
  name: Pet Collar
  description: Used to name pets. Front towards owner.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
    layers:
    - state: dogtag
      map: ["enum.DogtagVisuals.Taken"]
  - type: PetNamingItem
    maxLength: 32
    consumeOnUse: true
    range: 1.5
  - type: UserInterface
    interfaces:
      enum.PetNamingUiKey.Key:
        type: PetNamingBui
